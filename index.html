<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ESPN Fantasy</title>

  <!-- iPhone Home Screen App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ESPN Fantasy">
  <meta name="application-name" content="ESPN Fantasy">
  <meta name="theme-color" content="#000000">

  <!-- HOME SCREEN ICON -->
  <link
    rel="apple-touch-icon"
    sizes="512x512"
    href="./apple-touch-icon.png?v=3"
  >

  <link
    rel="icon"
    type="image/png"
    href="./apple-touch-icon.png?v=3"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    #player {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #000;

      object-fit: contain;
    }

    #startScreen {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 10;
    }

    #logo {
      width: 110px;
      height: 110px;

      border-radius: 24px;

      margin-bottom: 28px;
    }

    #playButton {
      appearance: none;
      border: none;

      background: #ffffff;
      color: #000000;

      padding: 15px 28px;

      border-radius: 30px;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    #openButton {
      display: none;

      position: fixed;

      left: 50%;
      bottom: calc(30px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      appearance: none;
      border: none;

      background: #ffffff;
      color: #000000;

      padding: 15px 25px;

      border-radius: 30px;

      font-size: 16px;
      font-weight: 700;

      z-index: 20;
    }
  </style>
</head>

<body>

  <!-- AD VIDEO -->
  <video
    id="player"
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source src="./fantasy-ad.mp4" type="video/mp4">
  </video>


  <!-- START SCREEN -->
  <div id="startScreen">

    <img
      id="logo"
      src="./apple-touch-icon.png"
      alt="Fantasy"
    >

    <button id="playButton">
      Play
    </button>

  </div>


  <!-- FALLBACK BUTTON -->
  <button id="openButton">
    Open ESPN Fantasy
  </button>


  <script>

    const player =
      document.getElementById("player");

    const startScreen =
      document.getElementById("startScreen");

    const playButton =
      document.getElementById("playButton");

    const openButton =
      document.getElementById("openButton");


    /*
      ESPN Fantasy URL

      On iPhone, iOS may hand this URL
      directly to the installed ESPN app.
    */

    const fantasyURL =
      "https://fantasy.espn.com/";


    function openFantasy() {

      window.location.href = fantasyURL;

      /*
        If iOS doesn't open the app,
        show a backup button.
      */

      setTimeout(() => {

        openButton.style.display = "block";

      }, 1200);

    }


    /*
      Start advertisement
    */

    playButton.addEventListener(
      "click",
      async function () {

        startScreen.style.display = "none";

        try {

          player.currentTime = 0;

          await player.play();

        }

        catch (error) {

          console.log(
            "Video playback blocked:",
            error
          );

          startScreen.style.display = "flex";

        }

      }
    );


    /*
      When advertisement ends,
      open ESPN Fantasy.
    */

    player.addEventListener(
      "ended",
      function () {

        openFantasy();

      }
    );


    /*
      Backup ESPN button
    */

    openButton.addEventListener(
      "click",
      function () {

        openFantasy();

      }
    );

  </script>

</body>
</html>
