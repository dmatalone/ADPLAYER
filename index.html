<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>ESPN Fantasy</title>

  <!-- iPhone Home Screen Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ESPN Fantasy">
  <meta name="application-name" content="ESPN Fantasy">
  <meta name="theme-color" content="#000000">

  <!-- ESPN Fantasy Home Screen Icon -->
  <link
    rel="apple-touch-icon"
    href="./apple-touch-icon.png?v=4"
  >

  <link
    rel="icon"
    type="image/png"
    href="./apple-touch-icon.png?v=4"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    /* VIDEO */

    #player {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;
      background: #000;
    }

    /* START SCREEN */

    #startScreen {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #000;

      z-index: 10;
    }

    #logo {
      width: 110px;
      height: 110px;

      border-radius: 24px;

      margin-bottom: 28px;
    }

    #playButton {
      border: none;

      padding: 15px 32px;

      border-radius: 30px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    /* SKIP AD BUTTON */

    #skipButton {
      display: none;
      position: fixed;
      right: 18px;
      bottom: calc(24px + env(safe-area-inset-bottom));

      border: 1px solid rgba(255, 255, 255, 0.55);
      padding: 12px 18px;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      z-index: 30;
    }

    /* FALLBACK BUTTON */

    #openButton {
      display: none;

      position: fixed;

      left: 50%;
      bottom: calc(
        30px + env(safe-area-inset-bottom)
      );

      transform: translateX(-50%);

      border: none;

      padding: 15px 25px;

      border-radius: 30px;

      background: white;
      color: black;

      font-size: 16px;
      font-weight: 700;

      white-space: nowrap;

      z-index: 20;
    }
  </style>
</head>


<body>

  <!-- YOUR 30 SECOND AD -->

  <video
    id="player"
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source
      src="./fantasy-ad.mp4"
      type="video/mp4"
    >
  </video>


  <!-- START SCREEN -->

  <div id="startScreen">

    <img
      id="logo"
      src="./apple-touch-icon.png"
      alt="ESPN Fantasy"
    >

    <button id="playButton">
      Play Ad
    </button>

  </div>


  <!-- SKIP AD -->

  <button id="skipButton">
    Skip Ad
  </button>


  <!-- APP FALLBACK -->

  <button id="openButton">
    Open ESPN Fantasy App
  </button>


  <script>

    const player =
      document.getElementById("player");

    const startScreen =
      document.getElementById("startScreen");

    const playButton =
      document.getElementById("playButton");

    const skipButton =
      document.getElementById("skipButton");

    const openButton =
      document.getElementById("openButton");

    let skipTimer;


    /*
      OPEN ESPN FANTASY APP
    */

    function openFantasy() {

      clearTimeout(skipTimer);
      skipButton.style.display = "none";
      player.pause();

      /*
        Attempt to launch the installed
        ESPN Fantasy app directly.
      */

      window.location.href =
        "espnfantasy://";


      /*
        If iOS doesn't accept the app
        link, show a manual button.
      */

      setTimeout(function () {

        openButton.style.display =
          "block";

      }, 1500);

    }


    /*
      PLAY AD
    */

    playButton.addEventListener(
      "click",

      async function () {

        startScreen.style.display =
          "none";

        openButton.style.display =
          "none";

        skipButton.style.display =
          "none";

        clearTimeout(skipTimer);

        try {

          player.currentTime = 0;

          await player.play();

          skipTimer = setTimeout(function () {

            skipButton.style.display =
              "block";

          }, 10000);

        }

        catch (error) {

          console.log(error);

          startScreen.style.display =
            "flex";

        }

      }
    );


    /*
      SKIP AD AFTER 10 SECONDS
    */

    skipButton.addEventListener(
      "click",

      function () {

        openFantasy();

      }
    );


    /*
      AD FINISHED
    */

    player.addEventListener(
      "ended",

      function () {

        openFantasy();

      }
    );


    /*
      MANUAL APP BUTTON
    */

    openButton.addEventListener(
      "click",

      function () {

        window.location.href =
          "espnfantasy://";

      }
    );

  </script>

</body>
</html>
