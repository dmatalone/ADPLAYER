<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ESPN Fantasy</title>

  <!-- Standalone app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ESPN Fantasy">
  <meta name="application-name" content="ESPN Fantasy">
  <meta name="theme-color" content="#000000">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=5">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png?v=5">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }

    #logo {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 28px;
    }

    #playButton {
      border: none;
      padding: 15px 32px;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #skipButton {
      display: none;
      position: fixed;
      right: 18px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      border: 1px solid rgba(255,255,255,.55);
      padding: 12px 18px;
      border-radius: 8px;
      background: rgba(0,0,0,.7);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      z-index: 30;
    }

    #openButton {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(30px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      z-index: 20;
    }
  </style>
</head>
<body>

  <video id="player" playsinline webkit-playsinline preload="auto">
    <source src="./fantasy-ad.mp4" type="video/mp4">
  </video>

  <div id="startScreen">
    <img id="logo" src="./apple-touch-icon.png" alt="ESPN Fantasy">
    <button id="playButton">Open Fantasy</button>
  </div>

  <button id="skipButton">Skip Ad</button>
  <button id="openButton">Open ESPN Fantasy App</button>

  <script>
    const player = document.getElementById("player");
    const startScreen = document.getElementById("startScreen");
    const playButton = document.getElementById("playButton");
    const skipButton = document.getElementById("skipButton");
    const openButton = document.getElementById("openButton");

    let skipTimer;

    function openFantasy() {
      clearTimeout(skipTimer);
      skipButton.style.display = "none";
      player.pause();
      window.location.href = "espnfantasy://";

      setTimeout(function () {
        openButton.style.display = "block";
      }, 1500);
    }

    playButton.addEventListener("click", async function () {
      startScreen.style.display = "none";
      openButton.style.display = "none";
      skipButton.style.display = "none";
      clearTimeout(skipTimer);

      try {
        player.currentTime = 0;
        await player.play();

        skipTimer = setTimeout(function () {
          skipButton.style.display = "block";
        }, 10000);
      } catch (error) {
        console.log(error);
        startScreen.style.display = "flex";
      }
    });

    skipButton.addEventListener("click", openFantasy);
    player.addEventListener("ended", openFantasy);

    openButton.addEventListener("click", function () {
      window.location.href = "espnfantasy://";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>

</body>
</html>
